# Windows (x86_64) 向け qemu-system-i386 のビルド.
# Linux (Fedora コンテナ) の MinGW でクロスビルドし、依存 DLL と GTK の実行時ファイルをまとめた zip を
# 成果物 (artifact) にし、リリース btron-latest の添付ファイルを差し替える.
# ソースは本家の QEMU_REF を取得し、btron/patches/*.patch があれば当てる.
# ccache の結果を actions/cache で引き継ぐので、2 回目以降は変更したファイルだけがコンパイルされる.
name: btron-windows

on:
  push:
    branches: [btron]
    paths:
      - 'btron/**'
      - '.github/workflows/btron-windows.yml'
  workflow_dispatch:
    inputs:
      qemu_url:
        description: 'QEMU source repository (default: upstream)'
        required: false
        default: ''
      qemu_ref:
        description: 'Branch or tag to build (default: the QEMU_REF below)'
        required: false
        default: ''
      apply_patches:
        description: 'Apply btron/patches'
        type: boolean
        default: true
      publish:
        description: 'Replace the zip of the btron-latest release'
        type: boolean
        default: true

# 手動実行で別のソースを指定したときの例 (本家の master に当てたブランチのビルド確認):
#   qemu_url=https://github.com/tadwg/qemu.git qemu_ref=grab-on-focus apply_patches=false publish=false
env:
  QEMU_REF: ${{ inputs.qemu_ref || 'v11.1.3' }}
  QEMU_URL: ${{ inputs.qemu_url || 'https://gitlab.com/qemu-project/qemu.git' }}
  APPLY_PATCHES: ${{ inputs.apply_patches == false && 'no' || 'yes' }}
  PUBLISH: ${{ inputs.publish == false && 'no' || 'yes' }}
  RELEASE_TAG: btron-latest

concurrency:
  group: btron-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:43
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: btron-src
          sparse-checkout: |
            btron
          sparse-checkout-cone-mode: true

      - name: Install build tools
        run: |
          dnf -y -q install \
            bash bison bzip2 ccache diffutils findutils flex gcc git glib2-devel make \
            ninja-build python3 python3-setuptools python3-wheel sed tar zip zstd \
            mingw-w64-tools mingw64-gcc mingw64-gcc-c++ mingw64-pkg-config \
            mingw64-glib2 mingw64-pixman mingw64-gtk3 mingw64-libepoxy mingw64-SDL2 \
            mingw64-gettext mingw64-libpng mingw64-libjpeg-turbo mingw64-bzip2 mingw64-zstd
          # Fedora の mingw64-SDL2 は SDL3 を実行時に読み込む互換ライブラリ (sdl2-compat) なので SDL3 も入れる
          dnf -y -q install --skip-unavailable mingw64-SDL3 mingw64-hicolor-icon-theme || true
          mkdir -p /usr/libexec/ccache-wrappers
          for c in cc gcc c++ g++; do ln -sf /usr/bin/ccache /usr/libexec/ccache-wrappers/x86_64-w64-mingw32-$c; done

      - name: Get QEMU source
        run: |
          git clone -q --depth 1 --branch "$QEMU_REF" "$QEMU_URL" qemu
          shopt -s nullglob
          for p in $([ "$APPLY_PATCHES" = yes ] && echo btron-src/btron/patches/*.patch); do
            echo "apply $p"
            git -C qemu apply --verbose "$PWD/$p"
          done
          git -C qemu diff --stat

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-win64-${{ env.QEMU_REF }}-${{ github.run_id }}
          restore-keys: |
            ccache-win64-${{ env.QEMU_REF }}-
            ccache-win64-

      - name: Configure
        run: |
          export PATH=/usr/libexec/ccache-wrappers:$PATH CCACHE_DIR=$PWD/.ccache CCACHE_MAXSIZE=2G
          ccache -z
          mkdir -p qemu/build && cd qemu/build
          ../configure --cross-prefix=x86_64-w64-mingw32- --prefix=/qemu \
            --target-list=i386-softmmu \
            --enable-gtk --enable-sdl \
            --disable-docs --disable-tools --disable-guest-agent --disable-werror \
            --disable-curl --disable-gnutls --disable-nettle --disable-gcrypt \
            --disable-vnc --disable-spice --disable-libusb --disable-usb-redir

      - name: Build
        run: |
          export PATH=/usr/libexec/ccache-wrappers:$PATH CCACHE_DIR=$PWD/.ccache CCACHE_MAXSIZE=2G
          cd qemu/build
          time make -j"$(nproc)"
          ccache -s

      - name: Package
        run: |
          set -e
          SYS=/usr/x86_64-w64-mingw32/sys-root/mingw
          cd qemu/build
          make install DESTDIR=$PWD/dist >/dev/null
          D=$PWD/dist/qemu
          rm -rf $D/include
          python3 $GITHUB_WORKSPACE/btron-src/btron/collect-dlls.py x86_64-w64-mingw32-objdump $SYS/bin $D $D/*.exe
          # 実行時に LoadLibrary で読む DLL (objdump の依存関係には出ない)
          if grep -qa 'SDL3' $D/SDL2.dll 2>/dev/null; then
            test -f $SYS/bin/SDL3.dll || { echo "SDL2.dll needs SDL3.dll but it is not installed" >&2; exit 1; }
          fi
          if [ -f $SYS/bin/SDL3.dll ]; then
            cp $SYS/bin/SDL3.dll $D/
            python3 $GITHUB_WORKSPACE/btron-src/btron/collect-dlls.py x86_64-w64-mingw32-objdump $SYS/bin $D $D/SDL3.dll
          fi
          # GTK の実行時ファイル (画像ローダ, 設定スキーマ, 基本アイコン)
          if [ -d $SYS/lib/gdk-pixbuf-2.0 ]; then
            mkdir -p $D/lib && cp -r $SYS/lib/gdk-pixbuf-2.0 $D/lib/
            python3 $GITHUB_WORKSPACE/btron-src/btron/collect-dlls.py x86_64-w64-mingw32-objdump $SYS/bin $D $(find $D/lib -name '*.dll')
          fi
          mkdir -p $D/share/glib-2.0/schemas
          cp $SYS/share/glib-2.0/schemas/*.xml $D/share/glib-2.0/schemas/ 2>/dev/null || true
          glib-compile-schemas $D/share/glib-2.0/schemas || true
          if [ -d $SYS/share/icons/hicolor ]; then mkdir -p $D/share/icons && cp -r $SYS/share/icons/hicolor $D/share/icons/; fi
          cp $GITHUB_WORKSPACE/btron-src/btron/README.md $D/README-btron.md
          (cd $GITHUB_WORKSPACE/qemu && git log -1 --format='%H %d' > $D/QEMU-SOURCE.txt)
          echo "build: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID ($GITHUB_SHA)" >> $D/QEMU-SOURCE.txt
          ls $D/*.dll | xargs -n1 basename | tr '\n' ' '; echo
          du -sh $D
          cd $PWD/dist && zip -qr $GITHUB_WORKSPACE/qemu-i386-win64.zip qemu
          ls -la $GITHUB_WORKSPACE/qemu-i386-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: qemu-i386-win64-${{ env.QEMU_REF }}
          path: qemu-i386-win64.zip
          retention-days: 30

      - name: Publish release
        if: env.PUBLISH == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: QEMU ${{ env.QEMU_REF }} for Windows (qemu-system-i386, btron)
          body: |
            btron ブランチの最新ビルドです (ビルドのたびに添付ファイルを差し替えます)。
            QEMU: ${{ env.QEMU_REF }} + btron/patches
            ビルド: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (${{ github.sha }})
            使い方とライセンス: ${{ github.server_url }}/${{ github.repository }}/blob/btron/btron/README.md
          files: qemu-i386-win64.zip
          overwrite_files: true
          make_latest: true
